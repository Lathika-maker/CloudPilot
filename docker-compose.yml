version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cloudpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudpilot
      POSTGRES_USER: cloudpilot_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create a .env file and set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpilot_user -d cloudpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Python FastAPI + ML Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cloudpilot-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://cloudpilot_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/cloudpilot"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. React + Vite + Tailwind Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cloudpilot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
