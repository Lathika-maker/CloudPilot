name: CI

on:
  push:
    branches: [main, ux-cleanup, feature/hybrid-quantum-api]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate one-command quantum launcher
        run: bash -n scripts/dev-quantum.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run build

  backend:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest tests/

  quantum-api:
    name: Quantum API validation tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/quantum_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/quantum_api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q main.py
      - run: pytest -q

